name: probe-latino
on:
  push:
    branches: [nuvio-anime]
    paths: ["tools/probe-latino.mjs", ".github/workflows/probe-latino.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund && npm install --no-save cheerio
      - run: git clone --depth 1 https://github.com/Droydr13/pluggin-latino /tmp/pl
      - run: node tools/probe-latino.mjs /tmp/pl jkanime,monoschinos,katanime,henaojara,mundodonghua,donghualife,animeav1,tioanime
